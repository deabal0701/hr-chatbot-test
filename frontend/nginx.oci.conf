#########################################
## win-AI Frontend Nginx Configuration (OCI VM)
## HTTPS + HTTP→HTTPS 리다이렉트
## Frontend + Backend API + GitLab Reverse Proxy
#########################################

#########################################
# HTTP → HTTPS 리다이렉트 (메인 도메인)
#########################################
server {
    listen 80;
    server_name winai.co.kr www.winai.co.kr;
    return 301 https://$host$request_uri;
}

#########################################
# HTTP → HTTPS 리다이렉트 (GitLab)
#########################################
server {
    listen 80;
    server_name gitlab.winai.co.kr;
    return 301 https://gitlab.winai.co.kr$request_uri;
}

#########################################
# Frontend HTTPS 서버
#########################################
server {
    listen 443 ssl;
    listen 19080 ssl;
    server_name winai.co.kr www.winai.co.kr localhost;

    ssl_certificate     /etc/letsencrypt/live/winai.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winai.co.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    #########################################
    # Static Cache
    #########################################
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    #########################################
    # Backend API
    #########################################
    location /api/ {

        proxy_pass http://winai-backend:19090/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # SSE streaming support (Agent, NL2SQL)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    #########################################
    # Vue SPA
    #########################################
    location / {
        try_files $uri $uri/ /index.html;
    }

    #########################################
    # Health Check
    #########################################
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    #########################################
    # Error
    #########################################
    error_page 404 /index.html;
}

#########################################
# GitLab HTTPS Reverse Proxy
#########################################
server {

    listen 443 ssl;
    server_name gitlab.winai.co.kr;

    ssl_certificate     /etc/letsencrypt/live/winai.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winai.co.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 250m;

    location / {

        proxy_pass http://gitlab:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        proxy_request_buffering off;
    }
}